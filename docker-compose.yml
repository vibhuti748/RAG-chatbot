services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      # 5433 on your machine, so it does not clash with the URL shortener's 5432
      - "5433:5432"
    volumes:
      - pgdata_rag:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      # 6380 on your machine, so it does not clash with the URL shortener's 6379
      - "6380:6379"

  app:
    build: .
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env            # your API key and settings (not stored in Git)
    environment:
      DATABASE_URL: postgresql+psycopg2://rag:rag@db:5432/rag
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata_rag:
